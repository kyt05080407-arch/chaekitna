name: Book lists

# 책 목록 한 번에 확인용 data/lists.json을 만든다.
# - 서울대 권장도서 100선·학과별 책장·사람별 책장(scripts/shelves.mjs): 책마다 정보나루 도서 검색으로 ISBN·표지를 찾는다.
#   처음 한 번만 호출이 많고(한 번에 최대 250번, 다 못 찾으면 다음 실행에서 이어서), 그다음부터는 지난번에 찾은 책을
#   그대로 써서 못 찾은 책만 다시 찾는다. 여러 책장에 같은 책이 있으면 한 번만 찾는다.
# - 중·고등학생이 최근 30일 동안 많이 빌린 책: 호출 2번.
# 매주 월요일 06:30(한국 시간), 인기 도서 갱신 뒤에 돈다. 인증키(D4L_AUTH_KEY)가 없으면 건너뛴다.
on:
  schedule:
    - cron: '30 21 * * 0'
  workflow_dispatch:
    inputs:
      max_calls:
        description: '이번에 도서 검색을 부를 최대 횟수'
        default: '250'

permissions:
  contents: write

concurrency:
  group: data-update

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - id: key
        env:
          D4L_AUTH_KEY: ${{ secrets.D4L_AUTH_KEY }}
        run: |
          if [ -n "$D4L_AUTH_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::D4L_AUTH_KEY가 아직 없어서 이번에는 건너뛰어요."
          fi

  update:
    needs: check
    if: needs.check.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build book lists
        env:
          D4L_AUTH_KEY: ${{ secrets.D4L_AUTH_KEY }}
          LISTS_MAX_CALLS: ${{ inputs.max_calls || '250' }}
        run: node scripts/build-lists.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lists.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요."
            exit 0
          fi
          git commit -m "data: 책 목록 갱신"
          git pull --rebase origin main
          git push origin HEAD:main

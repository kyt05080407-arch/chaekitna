name: Monthly library list

# 매월 2일 03:00(한국 시간)에 전국 도서관 목록을 새로 받는다.
# 받은 개수가 갑자기 줄면 스크립트가 덮어쓰지 않고 실패한다(잘못된 응답으로 목록이 망가지는 것을 막음).
# 인증키(D4L_AUTH_KEY)를 넣기 전에는 실패하지 않고 건너뛴다.
on:
  schedule:
    - cron: '0 18 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - id: key
        env:
          D4L_AUTH_KEY: ${{ secrets.D4L_AUTH_KEY }}
        run: |
          if [ -n "$D4L_AUTH_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::D4L_AUTH_KEY가 아직 없어서 이번에는 건너뛰어요. Settings → Secrets and variables → Actions에 넣어 주세요."
          fi

  update:
    needs: check
    if: needs.check.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch library list
        env:
          D4L_AUTH_KEY: ${{ secrets.D4L_AUTH_KEY }}
        run: node scripts/fetch-libraries.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/libraries.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요."
            exit 0
          fi
          git commit -m "data: 도서관 목록 갱신"
          git pull --rebase origin main
          git push origin HEAD:main

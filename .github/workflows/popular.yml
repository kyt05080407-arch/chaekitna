name: Weekly popular books

# 매주 월요일 06:00(한국 시간)에 지난 7일 인기 대출 도서를 받아 저장한다.
# 지역·연령은 저장소 Settings → Secrets and variables → Actions → Variables에서
# POPULAR_REGION(기본 37=경북), POPULAR_AGE(기본 a17=고등학생)로 바꿀 수 있다.
# 17개 시·도별 목록(data/popular/지역코드.json)도 함께 만든다(호출 최대 34번).
# 인증키(D4L_AUTH_KEY)를 넣기 전에는 실패하지 않고 건너뛴다.
on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - id: key
        env:
          D4L_AUTH_KEY: ${{ secrets.D4L_AUTH_KEY }}
        run: |
          if [ -n "$D4L_AUTH_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::D4L_AUTH_KEY가 아직 없어서 이번에는 건너뛰어요. Settings → Secrets and variables → Actions에 넣어 주세요."
          fi

  update:
    needs: check
    if: needs.check.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch popular books
        env:
          D4L_AUTH_KEY: ${{ secrets.D4L_AUTH_KEY }}
          POPULAR_REGION: ${{ vars.POPULAR_REGION || '37' }}
          POPULAR_AGE: ${{ vars.POPULAR_AGE || 'a17' }}
        run: node scripts/fetch-popular.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/popular.json data/history data/popular
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없어요."
            exit 0
          fi
          git commit -m "data: 이번 주 인기 도서 갱신"
          git pull --rebase origin main
          git push origin HEAD:main

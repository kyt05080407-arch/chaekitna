name: API check

# 정보나루 인증키가 승인되면 한 번 직접 실행해서(Actions → API check → Run workflow)
# 실제 응답이 앱이 기대하는 모양인지 확인한다. 호출 6번을 쓴다.
on:
  workflow_dispatch:
    inputs:
      region:
        description: '확인할 지역 코드 (37=경북)'
        default: '37'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check 정보나루 responses
        env:
          D4L_AUTH_KEY: ${{ secrets.D4L_AUTH_KEY }}
          CHECK_REGION: ${{ inputs.region }}
        run: node scripts/check-api.mjs
